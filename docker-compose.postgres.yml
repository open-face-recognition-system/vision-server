version: '3.8'

services:
  postgres:
    image: postgres:13
    container_name: vision_server_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: face_recognizer
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d face_recognizer']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vision-backend

volumes:
  postgres-data:

networks:
  vision-backend:
    driver: bridge
